{{ define "main" }}

<h1 class="text-center text-4xl font-bold text-primary-500 dark:text-primary-400 mt-15 mb-2">{{ .Title }}</h1>
{{ .Content }}

<div class="text-secondary-400 dark:text-secondary-500 text-center mt-5 mb-10 text-sm">找到 {{ len .Pages }} 个结果</div>
<div class="grid grid-cols-1 xl:grid-cols-2  gap-5">
	{{- range ( .Paginate .Pages 10 ).Pages }}
	{{ partial "post-preview.html" (dict "page" . "summaryLength" 200) }}
	{{- end }}
</div>

<div class="flex">
	{{ partial "pagination.html" . }}
</div>

{{ end }}
