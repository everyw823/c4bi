{{- $page := .page}}

<nav aria-label="breadcrumb" class="breadcrumb">
  <ol class="breadcrumb__list">
    {{ range $page.Ancestors.Reverse }}

    <li class="breadcrumb__item">
      <a class="breadcrumb__link" href="{{ .Permalink }}">{{ .Title }}</a>
    </li> <div class="breadcrumb__separator" aria-hidden="true"> / </div>
    {{ end }}
    <li class="breadcrumb__item breadcrumb__item--current" aria-current="page">
      <strong class="breadcrumb__current">
        {{- if (T $page.Title)}}{{ T $page.Title }}{{- else }}{{ $page.Title }}{{- end }}</strong>
    </li>
  </ol>
</nav>
