<div class="masthead">
<a class="masthead__brand" href="/" id="logo-container">
  <div class="masthead__logo-box">
    <figure class="masthead__logo masthead__logo--wide">
      <img class="masthead__logo-image" src="/logo.svg" data-svg-inject data-svg-tint data-logo-responsive alt="">
    </figure>
    <figure class="masthead__logo masthead__logo--compact">
      <img class="masthead__logo-image" src="/logo-sm.svg" data-svg-inject data-svg-tint data-logo-responsive alt="">
    </figure>
  </div>
</a>
<div class="masthead__spacer"></div>

  <div class="masthead__aside">

    <nav class="masthead__nav">
{{ partial "menu/main_menu.html" (dict "menuID" "main" "page" .) }}</nav>


      <div class="masthead__motto" data-timer>
        {{ partial (printf "motto.%s.html" .Lang) . }}
</div>
</div>
</div>
