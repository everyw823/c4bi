

<figure class="img-container overflow-hidden w-fit flex flex-col mx-auto items-center justify-center p-5">
    <div class="relative">
  <img loading="lazy" data-origin="md" class="dark:brightness-75 rounded-md" src="{{ .Destination | safeURL  }}" alt="{{ .PlainText }}"
      {{- /* 设置图片Title, 鼠标滑上去的时候会显示文字 */ -}}
      {{- with .Title }}
        title="{{ . }}"
      {{- end -}}

      {{- /* 设置宽度 */ -}}
      {{- with index .Attributes "width" -}}
        width="{{ . }}"
      {{- end -}}

      {{- /* 设置高度 */ -}}
      {{- with index .Attributes "height" -}}
        height="{{ . }}"
      {{- end -}}
    >
    <a target="_blank" href="{{ .Destination | safeURL  }}" class="w-6 h-6 opacity-85 lg:opacity-50 hover:opacity-85 transition-opacity bg-primary-50 border border-primary-500 rounded-md absolute top-2 right-2 p-1">
      <i data-lucide="zoom-in" width="14px" height="14px"></i>
  </a>
    </div>
    {{- /* 设置figure标题 */ -}}
    {{- with index .Attributes "caption" -}}
        <figcaption>{{ . }}</figcaption>
    {{- end -}}
</figure>
