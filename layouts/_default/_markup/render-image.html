

<figure class="flex flex-col items-center justify-center py-5">
    <img origin="md" class="rounded-md" src="{{ .Destination | safeURL  }}" alt="{{ .PlainText }}"
      {{- /* 设置图片Title, 鼠标滑上去的时候会显示文字 */ -}}
      {{- with .Title }}
        title="{{ . }}"
      {{- end -}}

      {{- /* 设置宽度 */ -}}
      {{- with index .Attributes "width" -}}
        width="{{ . }}"
      {{- end -}}

      {{- /* 设置高度 */ -}}
      {{- with index .Attributes "height" -}}
        height="{{ . }}"
      {{- end -}}
    >

    {{- /* 设置figure标题 */ -}}
    {{- with index .Attributes "caption" -}}
        <figcaption>{{ . }}</figcaption>
    {{- end -}}
</figure>
