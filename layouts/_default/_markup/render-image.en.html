

<figure class="img-container" data-img-container>
    <div class="img-container__frame">
  <img loading="lazy" data-origin="md" class="{{- with index .Attributes "class" -}}{{print . " "}}{{- end -}}img-container__image" src="{{ .Destination | safeURL  }}" alt="{{ .PlainText }}"
      {{- /* 设置图片Title, 鼠标滑上去的时候会显示文字 */ -}}
      {{- with .Title }}
        title="{{ . }}"
      {{- end -}}

      {{- /* 设置宽度 */ -}}
      {{- with index .Attributes "width" -}}
        width="{{ . }}"
      {{- end -}}

      {{- /* 设置高度 */ -}}
      {{- with index .Attributes "height" -}}
        height="{{ . }}"
      {{- end -}}
    >

  <div class="img-container__actions">
    <a target="_blank" href="{{ .Destination | safeURL  }}" class="img-container__action">
      <i data-lucide="zoom-in" width="14px" height="14px"></i>
  </a>

  {{- with index .Attributes "credit" -}}
    <a target="_blank" href="{{ . }}" class="img-container__action">
      <div class="img-container__credit">
      <i data-lucide="book-open-check" width="14px" height="14px"></i><div class="img-container__credit-label">&nbsp;Artist</div></div>
  </a>
</div>
  {{- end -}}

    </div>
    {{- /* 设置figure标题 */ -}}
    {{- with index .Attributes "caption" -}}
        <figcaption class="img-container__caption">{{ . }}</figcaption>
    {{- end -}}
</figure>
