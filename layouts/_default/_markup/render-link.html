{{- $u := urls.Parse .Destination -}}



{{- if eq .Destination "wk" }}
<span class="under-construction text-olive-500 hover:text-olive-600">
  {{- with .Text }}{{ . }}{{ end -}}
</span>
{{- else }}
<a href="{{ .Destination | safeURL }}" class="text-brand-500 dark:text-brand-400 hover:text-accent-500 dark:hover:text-accent-400 underline underline-offset-4 decoration-1 decoration-dashed"
  {{- with .Title }} title="{{ . }}"{{ end -}}
  {{- if $u.IsAbs }} rel="external"{{ end -}}
>
  {{- with .Text }}{{ . }}{{ end -}}
</a>

{{- end }}
{{- /* chomp trailing newline */ -}}
