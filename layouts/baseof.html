<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">

<head>
  {{ partial "head.html" . }}
</head>

<body class="bg-primary-500 overflow-hidden">
  <svg height="0" width="0" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="flood" color-interpolation-filters="linearRGB" filterUnits="objectBoundingBox"
        primitiveUnits="userSpaceOnUse">
        <feFlood id="svgflood" flood-color="#0400ff" flood-opacity="1" x="0%" y="0%" width="100%" height="100%"
          result="flood" />
        <feComposite in="flood" in2="SourceAlpha" operator="in" x="0%" y="0%" width="100%" height="100%"
          result="composite" />
    </defs>
  </svg>

  </filter>
  <div class="border-overlay"></div>

  {{- if eq .RelPermalink "/" }}
  <div id="real-container" class="overflow-y-auto overflow-x-hidden container mx-auto h-screen 
  py-5
  xl:px-48 lg:px-24 md:px-24 sm:px-24 px-8
  bg-white 
  ">
<div class="h-screen relative sm:pt-40" >
      <header class="force-center sm:h-auto">
        {{ partial "header.html" . }}
      </header>
</div>
      
 {{- else }}
  <div id="real-container" class="overflow-y-auto overflow-x-hidden container mx-auto h-auto
  py-10
  xl:px-48 lg:px-24 md:px-24 sm:px-24 px-8
  bg-white 
  "><div class="h-screen relative sm:pt-40" >
      <header class="sm:h-auto">
        {{ partial "header.html" . }}
      </header>
</div>
      
  {{- end }}
    <main>
        {{ block "main" . }}{{ end }}
      </main>

      <footer>
        {{ partial "footer.html" . }}
      </footer>


</body>

</html>
