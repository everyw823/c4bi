{{ define "main" }}
<article class="py-15 post">
  <div class="mb-10">
  <div class="title-wrapper flex items-center py-2 flex-wrap">
				<h1>{{ .Title }}</h1>
				<div class="flex-1 text-right text-secondary-300">全文字数</div> <label
					class="font-pixel text-center border-dotted border-4 border-secondary-200 w-[2em] h-[2em] py-[.33em] text-primary-300 text-3xl mr-3">{{
					.WordCount }}</label>
			</div>


  {{ $dateMachine := .Date | time.Format "2006-01-02T15:04:05-07:00" }}
  {{ $dateHuman := .Date | time.Format ":date_long" }}
  <time id="root-time" class=" text-secondary-400" datetime="{{ $dateMachine }}">{{ $dateHuman }}</time>
  

</div>
  {{ .Content }}
  {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
</article>
{{ end }}
