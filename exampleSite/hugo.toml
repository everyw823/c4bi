baseURL = 'http://localhost:1313/'
theme = 'c4bi'


defaultContentLanguage = 'zh-cn'
titleCaseStyle = "none"



[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.renderHooks]
      [markup.goldmark.renderHooks.image]
        useEmbedded = "fallback"
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false

[security]
  allowContent = ['! ^text/org$']
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']


[taxonomies]
  tag = 'tags'
  category = 'categories'
  source = 'sources'

[pagination]
  disableAliases = false
  pagerSize = 12
  path = 'page'

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[outputs]
  section = ['html', 'rss', 'json']
